<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Secure Micro Frontend Platform" />
  
  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" 
        content="default-src 'self'; 
                 script-src 'self'; 
                 style-src 'self' 'unsafe-inline'; 
                 img-src 'self' data: https:; 
                 font-src 'self' data:; 
                 connect-src 'self' 
                 http://localhost:8383 
                 https://auth.backend.finkrovl.ru; 
                 frame-src 'self' 
                 https://micro-frontend-1.yourdomain.ru 
                 https://micro-frontend-2.yourdomain.ru
                 http://localhost:*; 
                 frame-ancestors 'none';" />
  
  <!-- Защита от CSRF -->
  <meta name="csrf-token" content="" />
  
  <!-- Запрет индексации -->
  <meta name="robots" content="noindex, nofollow" />
  
  <title>Micro Frontend Platform</title>
</head>
<body>
  <div id="root"></div>
  
  <!-- Frame busting script -->
  <script>
    if (self !== top) {
      try {
        if (top.location.hostname !== self.location.hostname) {
          top.location.href = self.location.href;
        }
      } catch (e) {
        document.body.innerHTML = '<h1>Security Warning: This page cannot be displayed in a frame.</h1>';
        document.body.style.display = 'block';
      }
    }
  </script>
  
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
